<!DOCTYPE html>
<html lang="hi">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8600150273995118" crossorigin="anonymous"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Compressor - Smart Photo Tools</title>
<style>
  body { font-family: Arial, sans-serif; background: #f0f4f8; margin:0; padding:20px; text-align:center;}
  h1 { color: #2c3e50; }
  .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1);}
  select, input, button { padding: 12px; margin: 10px 0; width: 100%; font-size: 16px; box-sizing: border-box; }
  button { background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer;}
  button:hover { background: #2980b9; }
  #preview img, #result img { max-width: 100%; margin-top: 10px; border: 1px solid #ccc;}
  .info { font-size: 14px; color: #555; margin-top: 5px;}
  .nav { background:white; padding:10px; margin-bottom:15px; border-radius:10px; }
  .nav a { margin:0 6px; color:#3498db; text-decoration:none; font-size:13px;}
  .footer { text-align:center; margin-top:30px; padding:15px; font-size:14px; color:#666;}
  .footer a { margin: 0 10px; color: #3498db;}
  .compare { display:flex; justify-content:space-around; margin-top:10px; font-size:13px; }
</style>
</head>
<body>

<div class="nav">
  <a href="index.html">🆔 Aadhar/PAN</a>
  <a href="signature.html">✍️ Signature</a>
  <a href="passport.html">🛂 Passport</a>
  <a href="voterid.html">🗳️ Voter ID</a>

  <a href="wordcounter.html">📝 Word Counter</a>
  <a href="compressor.html">🗜️ Compressor</a>
</div>

<div class="container">
  <h1>🗜️ Image Compressor</h1>
  <p>किसी भी फोटो का Size कम करें, Quality बनाए रखते हुए</p>

  <label>Target Size चुनें:</label>
  <select id="targetSize">
    <option value="20">20 KB से कम</option>
    <option value="50" selected>50 KB से कम</option>
    <option value="100">100 KB से कम</option>
    <option value="200">200 KB से कम</option>
    <option value="500">500 KB से कम</option>
  </select>

  <input type="file" id="upload" accept="image/*">

  <div id="preview"></div>
  <div id="originalInfo" class="info"></div>

  <button onclick="processImage()">Compress करें</button>

  <div id="result"></div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<div class="footer">
  <a href="about.html">About Us</a> |
  <a href="privacy.html">Privacy Policy</a> |
  <a href="contact.html">Contact Us</a>
</div>

<script>
let uploadedImage = null;
let originalSizeKB = 0;

document.getElementById('upload').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (file) {
    originalSizeKB = Math.round(file.size / 1024);
    const reader = new FileReader();
    reader.onload = function(event) {
      uploadedImage = new Image();
      uploadedImage.onload = function() {
        document.getElementById('preview').innerHTML = '<img src="'+event.target.result+'" style="max-width:200px;">';
        document.getElementById('originalInfo').textContent = 'Original Size: ' + originalSizeKB + ' KB | Dimension: ' + uploadedImage.width + 'x' + uploadedImage.height + ' px';
      }
      uploadedImage.src = event.target.result;
    }
    reader.readAsDataURL(file);
  }
});

function processImage() {
  if (!uploadedImage) {
    alert('कृपया पहले एक फोटो अपलोड करें!');
    return;
  }

  const targetKB = parseInt(document.getElementById('targetSize').value);

  const canvas = document.getElementById('canvas');
  canvas.width = uploadedImage.width;
  canvas.height = uploadedImage.height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(uploadedImage, 0, 0);

  let quality = 0.9;
  let dataUrl = canvas.toDataURL('image/jpeg', quality);
  
  while (dataUrl.length > targetKB * 1024 * 1.37 && quality > 0.05) {
    quality -= 0.05;
    dataUrl = canvas.toDataURL('image/jpeg', quality);
  }

  const sizeKB = Math.round(dataUrl.length / 1.37 / 1024);
  const savedPercent = Math.round((1 - sizeKB/originalSizeKB) * 100);

  document.getElementById('result').innerHTML = 
    '<h3>✅ तैयार है!</h3>' +
    '<img src="'+dataUrl+'"><br>' +
    '<div class="compare">' +
    '<span>Original: ' + originalSizeKB + ' KB</span>' +
    '<span>नया: ' + sizeKB + ' KB</span>' +
    '<span style="color:green;">' + (savedPercent > 0 ? savedPercent + '% कम' : '') + '</span>' +
    '</div>' +
    '<a href="'+dataUrl+'" download="compressed_image.jpg"><button>⬇️ Download करें</button></a>';
}
</script>

</body>
</html>
