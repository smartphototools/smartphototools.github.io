<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ऑनलाइन पासपोर्ट साइज़ फोटो मेकर - Smart Photo Tools</title>
    <style>
        /* Smallpdf Inspired Modern CSS */
        :root {
            --primary-color: #0066ff;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #333333;
            --border-radius: 12px;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; }
        .container { max-width: 1000px; margin: 40px auto; padding: 20px; }
        
        /* Modern Upload Box */
        .upload-section {
            background: var(--card-bg);
            border: 2px dashed #b3c6ff;
            border-radius: var(--border-radius);
            padding: 60px 20px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            position: relative;
        }
        .upload-section:hover { border-color: var(--primary-color); background: #f0f5ff; }
        .upload-btn { background: var(--primary-color); color: white; padding: 15px 30px; font-size: 18px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .upload-hint { margin-top: 15px; color: #666; font-size: 14px; }
        
        /* Sample Image Hint */
        .sample-image-hint { width: 80px; height: 80px; opacity: 0.5; margin-bottom: 20px; border-radius: 50%; object-fit: cover; }

        /* Editing Panel (Hidden by default until upload) */
        .editing-panel {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px;
        }
        .settings-card { background: var(--card-bg); padding: 20px; border-radius: var(--border-radius); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .settings-group { margin-bottom: 15px; }
        .settings-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        .settings-group select, .settings-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align: center;">पासपोर्ट साइज़ फोटो मेकर</h1>
    <p style="text-align: center; color: #666;">आसानी से अपनी फोटो अपलोड करें, बैकग्राउंड बदलें और A4/A6 शीट में डाउनलोड करें।</p>

    <div class="upload-section" id="uploadBox">
        <img src="https://via.placeholder.com/80" alt="Sample Girl Portrait" class="sample-image-hint">
        <br>
        <button class="upload-btn">यहाँ फोटो अपलोड करें</button>
        <p class="upload-hint">या अपनी फोटो यहाँ खींच कर लाएँ (Drag & Drop)<br>समर्थित प्रारूप: JPEG, PNG, WEBP, HEIC</p>
    </div>

    <div class="editing-panel">
        <div class="settings-card">
            <h3>1. फोटो सेटिंग्स (Adjustments)</h3>
            <div class="settings-group">
                <label>चमक (Brightness)</label>
                <input type="range" min="0" max="100" value="50">
            </div>
            <div class="settings-group">
                <label>बैकग्राउंड का रंग (Background Color)</label>
                <input type="color" value="#ffffff">
            </div>
        </div>

        <div class="settings-card">
            <h3>2. डाउनलोड सेटिंग्स (Export)</h3>
            <div class="settings-group">
                <label>शीट का आकार (Sheet Size)</label>
                <select>
                    <option>केवल एकल फोटो (Single Photo)</option>
                    <option>A4 शीट (30 तस्वीरें)</option>
                    <option>A6 शीट (4 तस्वीरें)</option>
                </select>
            </div>
            <div class="settings-group">
                <label>फोटो प्रारूप (Format)</label>
                <select>
                    <option>JPEG (सामान्य उपयोग के लिए)</option>
                    <option>PNG (उच्च गुणवत्ता)</option>
                    <option>WEBP (वेब के लिए)</option>
                </select>
            </div>
            <button class="upload-btn" style="width: 100%; margin-top: 10px;">पूर्वावलोकन और डाउनलोड (Preview & Download)</button>
        </div>
    </div>
</div>

</body>
</html>
