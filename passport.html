<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ऑनलाइन पासपोर्ट साइज़ फोटो मेकर - Smart Photo Tools</title>
    <style>
        /* Smallpdf Inspired Modern CSS */
        :root {
            --primary-color: #0066ff;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #333333;
            --border-radius: 12px;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; }
        .container { max-width: 1000px; margin: 40px auto; padding: 20px; }
        
        .upload-section {
            background: var(--card-bg); border: 2px dashed #b3c6ff; border-radius: var(--border-radius);
            padding: 40px 20px; text-align: center; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .upload-btn, .action-btn { 
            background: var(--primary-color); color: white; padding: 12px 25px; font-size: 16px; 
            border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: background 0.3s; 
        }
        .upload-btn:hover, .action-btn:hover { background: #0052cc; }
        
        .preview-container { margin-bottom: 20px; display: flex; flex-direction: column; align-items: center; }
        .sample-image-hint { width: 150px; height: 200px; object-fit: cover; border-radius: 8px; border: 1px solid #ccc; background-color: #fff; }
        
        .editing-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .settings-card { background: var(--card-bg); padding: 20px; border-radius: var(--border-radius); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .settings-group { margin-bottom: 15px; }
        .settings-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        .settings-group select, .settings-group input[type="range"], .settings-group input[type="color"] { 
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; 
        }
        
        @media (max-width: 768px) { .editing-panel { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align: center;">पासपोर्ट साइज़ फोटो मेकर</h1>
    
    <div class="upload-section">
        <div class="preview-container">
            <img src="https://via.placeholder.com/150x200?text=Upload+Photo" alt="Preview" class="sample-image-hint" id="imagePreview">
        </div>
        
        <input type="file" id="fileInput" accept="image/jpeg, image/png, image/webp" style="display: none;">
        <button class="upload-btn" id="uploadBtn">फोटो चुनें</button>
        <button class="action-btn" id="removeBgBtn" style="background: #ff4757; margin-left: 10px;" onclick="alert('बैकग्राउंड हटाने के लिए Remove.bg API Key की आवश्यकता होगी। इसे हम अगले चरण में जोड़ेंगे।')">बैकग्राउंड हटाएँ (AI)</button>
    </div>

    <div class="editing-panel">
        <div class="settings-card">
            <h3>1. फोटो सेटिंग्स</h3>
            <div class="settings-group">
                <label>चमक (Brightness)</label>
                <input type="range" min="50" max="150" value="100" id="brightnessSlider">
            </div>
            <div class="settings-group">
                <label>बैकग्राउंड का रंग (पारदर्शी PNG के लिए)</label>
                <input type="color" value="#ffffff" id="bgColorPicker">
            </div>
        </div>

        <div class="settings-card">
            <h3>2. डाउनलोड सेटिंग्स</h3>
            <div class="settings-group">
                <label>शीट का आकार</label>
                <select id="sheetSize">
                    <option value="single">केवल एकल फोटो (35x45mm)</option>
                    <option value="a4">A4 शीट (30 तस्वीरें)</option>
                    <option value="a6">A6 शीट (4 तस्वीरें)</option>
                </select>
            </div>
            <div class="settings-group">
                <label>फोटो प्रारूप</label>
                <select id="imageFormat">
                    <option value="image/jpeg">JPEG (सामान्य)</option>
                    <option value="image/png">PNG (उच्च गुणवत्ता)</option>
                    <option value="image/webp">WEBP (वेब के लिए)</option>
                </select>
            </div>
            <button class="action-btn" style="width: 100%; margin-top: 10px; background: #2ed573;" id="downloadBtn">तैयार करें और डाउनलोड करें</button>
        </div>
    </div>
</div>

<!-- Hidden canvas for processing -->
<canvas id="processCanvas" style="display:none;"></canvas>

<script>
    const fileInput = document.getElementById('fileInput');
    const imagePreview = document.getElementById('imagePreview');
    const brightnessSlider = document.getElementById('brightnessSlider');
    const bgColorPicker = document.getElementById('bgColorPicker');
    const sheetSize = document.getElementById('sheetSize');
    const imageFormat = document.getElementById('imageFormat');
    let originalImage = new Image();

    // Upload & Preview
    document.getElementById('uploadBtn').addEventListener('click', () => fileInput.click());
    
    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                originalImage.src = event.target.result;
                imagePreview.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
    });

    // CSS Brightness Filter
    brightnessSlider.addEventListener('input', function() {
        imagePreview.style.filter = `brightness(${this.value}%)`;
    });
    
    // Background Color Simulation
    bgColorPicker.addEventListener('input', function() {
        imagePreview.style.backgroundColor = this.value;
    });

    // Auto-arrange & Download Logic using Canvas
    document.getElementById('downloadBtn').addEventListener('click', () => {
        if (!originalImage.src || originalImage.src.includes('placeholder.com')) {
            alert('कृपया पहले एक फोटो अपलोड करें!');
            return;
        }

        const canvas = document.getElementById('processCanvas');
        const ctx = canvas.getContext('2d');
        const format = imageFormat.value;
        const layout = sheetSize.value;
        const brightness = brightnessSlider.value;
        const bgColor = bgColorPicker.value;

        // 300 DPI Standard Dimensions (Passport 35x45mm -> 413x531 px)
        const ppWidth = 413; 
        const ppHeight = 531;
        const gap = 30; // Spacing between photos

        if (layout === 'single') {
            canvas.width = ppWidth;
            canvas.height = ppHeight;
        } else if (layout === 'a4') {
            canvas.width = 2480; // A4 Width at 300dpi
            canvas.height = 3508; // A4 Height at 300dpi
        } else if (layout === 'a6') {
            canvas.width = 1240; // A6 Width at 300dpi
            canvas.height = 1748; // A6 Height at 300dpi
        }

        // Fill background
        ctx.fillStyle = "#ffffff"; // Default white sheet
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Apply brightness
        ctx.filter = `brightness(${brightness}%)`;

        const drawPhoto = (x, y) => {
            // Draw selected background color behind photo
            ctx.fillStyle = bgColor;
            ctx.fillRect(x, y, ppWidth, ppHeight);
            // Draw Image
            ctx.drawImage(originalImage, x, y, ppWidth, ppHeight);
            // Draw border
            ctx.strokeStyle = "#000000";
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, ppWidth, ppHeight);
        };

        if (layout === 'single') {
            drawPhoto(0, 0);
        } else if (layout === 'a4') {
            // 5 columns, 6 rows = 30 photos
            let startX = 120, startY = 120;
            for (let row = 0; row < 6; row++) {
                for (let col = 0; col < 5; col++) {
                    drawPhoto(startX + col * (ppWidth + gap), startY + row * (ppHeight + gap));
                }
            }
        } else if (layout === 'a6') {
            // 2 columns, 2 rows = 4 photos
            let startX = 150, startY = 200;
            for (let row = 0; row < 2; row++) {
                for (let col = 0; col < 2; col++) {
                    drawPhoto(startX + col * (ppWidth + gap), startY + row * (ppHeight + gap));
                }
            }
        }

        // Trigger Download
        const dataURL = canvas.toDataURL(format, 0.9);
        const link = document.createElement('a');
        link.download = `Passport_Photo_${layout}.${format.split('/')[1]}`;
        link.href = dataURL;
        link.click();
    });
</script>

</body>
</html>
