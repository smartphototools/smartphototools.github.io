<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ऑनलाइन पासपोर्ट साइज़ फोटो मेकर - Smart Photo Tools</title>
    <!-- In-Browser AI Background Removal Library (No API Key Required) -->
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.3/dist/imglyRemoveBackground.umd.min.js"></script>
    <style>
        :root {
            --primary-color: #0066ff;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #333333;
            --border-radius: 12px;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; }
        .container { max-width: 1000px; margin: 40px auto; padding: 20px; }
        
        .upload-section {
            background: var(--card-bg); border: 2px dashed #b3c6ff; border-radius: var(--border-radius);
            padding: 40px 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .upload-btn, .action-btn { 
            background: var(--primary-color); color: white; padding: 12px 25px; font-size: 16px; 
            border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: background 0.3s; 
        }
        .upload-btn:hover, .action-btn:hover { background: #0052cc; }
        .action-btn:disabled { background: #999 !important; cursor: not-allowed; }
        
        .preview-container { margin-bottom: 20px; display: flex; flex-direction: column; align-items: center; }
        .sample-image-hint { width: 175px; height: 225px; object-fit: cover; border-radius: 8px; border: 1px solid #ccc; background-color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        .editing-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .settings-card { background: var(--card-bg); padding: 20px; border-radius: var(--border-radius); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .settings-group { margin-bottom: 15px; }
        .settings-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        .settings-group select, .settings-group input[type="range"], .settings-group input[type="color"] { 
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 13px;
        }
        
        .filter-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .filter-row label { font-size: 13px; font-weight: 500; margin: 0; width: 40%; }
        .filter-row input { width: 60%; }

        /* Loader CSS for Progress Indication */
        .loader {
            display: inline-block; width: 16px; height: 16px;
            border: 3px solid rgba(255,255,255,0.3); border-radius: 50%;
            border-top-color: #fff; animation: spin 1s ease-in-out infinite;
            vertical-align: middle; margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) { .editing-panel { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align: center;">पासपोर्ट साइज़ फोटो मेकर</h1>
    <p style="text-align: center; color: #666;">उच्च गुणवत्ता (High Quality) और सटीक 35x45mm अनुपात</p>
    
    <div class="upload-section">
        <div class="preview-container">
            <img src="https://via.placeholder.com/350x450?text=Upload+Photo" alt="Preview" class="sample-image-hint" id="imagePreview">
        </div>
        
        <input type="file" id="fileInput" accept="image/jpeg, image/png, image/webp" style="display: none;">
        <button class="upload-btn" id="uploadBtn">फोटो चुनें</button>
        <button class="action-btn" id="removeBgBtn" style="background: #ff4757; margin-left: 10px;">बैकग्राउंड हटाएँ (AI)</button>
        <div id="bgProgressText" style="font-size: 13px; color: #666; margin-top: 10px; font-weight: bold;"></div>
    </div>

    <div class="editing-panel">
        <div class="settings-card">
            <h3>1. उन्नत फोटो संवर्धन (Enhancement)</h3>
            
            <div class="filter-row">
                <label>रोशनी (Brightness)</label>
                <input type="range" min="50" max="150" value="100" id="brightSlider">
            </div>
            <div class="filter-row">
                <label>गहराई (Contrast)</label>
                <input type="range" min="50" max="150" value="100" id="contrastSlider">
            </div>
            <div class="filter-row">
                <label>रंग (Saturation)</label>
                <input type="range" min="0" max="200" value="100" id="satSlider">
            </div>

            <div class="settings-group" style="margin-top: 20px;">
                <label>बैकग्राउंड का रंग (पारदर्शी फोटो के लिए)</label>
                <input type="color" value="#ffffff" id="bgColorPicker">
            </div>
        </div>

        <div class="settings-card">
            <h3>2. उच्च गुणवत्ता डाउनलोड (Export)</h3>
            <div class="settings-group">
                <label>शीट का आकार</label>
                <select id="sheetSize">
                    <option value="single">केवल एकल फोटो (35x45mm)</option>
                    <option value="a4">A4 शीट (30 तस्वीरें)</option>
                    <option value="a6">A6 शीट (8 तस्वीरें - 4x2 Layout)</option>
                </select>
            </div>
            <div class="settings-group">
                <label>फोटो प्रारूप (Format)</label>
                <select id="imageFormat">
                    <option value="image/jpeg">JPEG / JPG (सामान्य फोटो, मोबाइल/इंटरनेट उपयोग)</option>
                    <option value="image/png">PNG (पारदर्शी बैकग्राउंड और उच्च गुणवत्ता)</option>
                    <option value="image/webp">WEBP (कम फ़ाइल आकार में अच्छी गुणवत्ता)</option>
                    <option value="psd" disabled>PSD (फ़ोटोशॉप परतें - केवल सॉफ़्टवेयर में समर्थित)</option>
                    <option value="gif" disabled>GIF (चलायमान चित्र - ब्राउज़र में असमर्थित)</option>
                </select>
            </div>
            <button class="action-btn" style="width: 100%; margin-top: 10px; background: #2ed573;" id="downloadBtn">तैयार करें और डाउनलोड करें</button>
        </div>
    </div>
</div>

<canvas id="processCanvas" style="display:none;"></canvas>

<script>
    const fileInput = document.getElementById('fileInput');
    const imagePreview = document.getElementById('imagePreview');
    const brightSlider = document.getElementById('brightSlider');
    const contrastSlider = document.getElementById('contrastSlider');
    const satSlider = document.getElementById('satSlider');
    const bgColorPicker = document.getElementById('bgColorPicker');
    
    let originalImage = new Image();

    // 1. फोटो अपलोड
    document.getElementById('uploadBtn').addEventListener('click', () => fileInput.click());
    
    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                originalImage.src = event.target.result;
                imagePreview.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
    });

    // 2. फिल्टर्स लागू करना
    function updatePreviewFilters() {
        imagePreview.style.filter = `brightness(${brightSlider.value}%) contrast(${contrastSlider.value}%) saturate(${satSlider.value}%)`;
    }
    brightSlider.addEventListener('input', updatePreviewFilters);
    contrastSlider.addEventListener('input', updatePreviewFilters);
    satSlider.addEventListener('input', updatePreviewFilters);
    bgColorPicker.addEventListener('input', () => imagePreview.style.backgroundColor = bgColorPicker.value);

    // 3. पूर्णतः निःशुल्क In-Browser AI Background Remover
    document.getElementById('removeBgBtn').addEventListener('click', async () => {
        if (!originalImage.src || originalImage.src.includes('placeholder.com')) {
            alert('कृपया पहले एक फोटो अपलोड करें!'); return;
        }

        const btn = document.getElementById('removeBgBtn');
        const progressText = document.getElementById('bgProgressText');
        
        btn.disabled = true;
        btn.innerHTML = '<span class="loader"></span> AI सक्रिय हो रहा है...';
        progressText.innerText = 'कृपया प्रतीक्षा करें, AI मॉडल फोटो को स्कैन कर रहा है (0%)...';

        try {
            // Imgly Background Removal Calling
            const blob = await imglyRemoveBackground(originalImage.src, {
                progress: (key, current, total) => {
                    const percent = Math.round((current / total) * 100);
                    progressText.innerText = `प्रगति: ${percent}% (चेहरे और किनारों की स्कैनिंग)`;
                }
            });

            const url = URL.createObjectURL(blob);
            originalImage.src = url;
            imagePreview.src = url;
            
            progressText.style.color = "green";
            progressText.innerText = '✅ बैकग्राउंड सफलतापूर्वक हटा दिया गया है!';
            btn.innerHTML = 'बैकग्राउंड हटाएँ (AI)';
            btn.disabled = false;
        } catch (error) {
            console.error(error);
            progressText.style.color = "red";
            progressText.innerText = '❌ बैकग्राउंड हटाने में त्रुटि आई। कृपया दूसरी फोटो का प्रयास करें।';
            btn.innerHTML = 'बैकग्राउंड हटाएँ (AI)';
            btn.disabled = false;
        }
    });

    // 4. डाउनलोड और प्रगति सूचक
    document.getElementById('downloadBtn').addEventListener('click', () => {
        if (!originalImage.src || originalImage.src.includes('placeholder.com')) {
            alert('कृपया पहले एक फोटो अपलोड करें!'); return;
        }

        const btn = document.getElementById('downloadBtn');
        const format = document.getElementById('imageFormat').value;
        const layout = document.getElementById('sheetSize').value;

        // बटन को लोडिंग स्टेट में डालना
        btn.disabled = true;
        btn.innerHTML = '<span class="loader"></span> फोटो तैयार हो रही है...';

        // setTimeout का उपयोग ताकि ब्राउज़र UI को अपडेट होने का समय मिले (फ़्रीज़ न हो)
        setTimeout(() => {
            try {
                const canvas = document.getElementById('processCanvas');
                const ctx = canvas.getContext('2d');
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = "high";

                const ppWidth = 413; 
                const ppHeight = 531;

                if (layout === 'single') {
                    canvas.width = ppWidth; canvas.height = ppHeight;
                } else if (layout === 'a4') {
                    canvas.width = 2480; canvas.height = 3508;
                } else if (layout === 'a6') {
                    canvas.width = 1748; canvas.height = 1240;
                }

                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.filter = `brightness(${brightSlider.value}%) contrast(${contrastSlider.value}%) saturate(${satSlider.value}%)`;

                const targetRatio = ppWidth / ppHeight;
                const imgRatio = originalImage.width / originalImage.height;
                let sWidth = originalImage.width, sHeight = originalImage.height, sX = 0, sY = 0;

                if (imgRatio > targetRatio) {
                    sWidth = originalImage.height * targetRatio;
                    sX = (originalImage.width - sWidth) / 2;
                } else {
                    sHeight = originalImage.width / targetRatio;
                    sY = (originalImage.height - sHeight) / 8;
                }

                const drawPhoto = (x, y) => {
                    ctx.fillStyle = bgColorPicker.value;
                    ctx.fillRect(x, y, ppWidth, ppHeight); 
                    ctx.drawImage(originalImage, sX, sY, sWidth, sHeight, x, y, ppWidth, ppHeight);
                    
                    ctx.strokeStyle = "#000000";
                    ctx.lineWidth = 3; 
                    ctx.strokeRect(x, y, ppWidth, ppHeight); 
                };

                if (layout === 'single') {
                    drawPhoto(0, 0);
                } else if (layout === 'a4') {
                    let startX = 120, startY = 120, gap = 30;
                    for (let row = 0; row < 6; row++) {
                        for (let col = 0; col < 5; col++) {
                            drawPhoto(startX + col * (ppWidth + gap), startY + row * (ppHeight + gap));
                        }
                    }
                } else if (layout === 'a6') {
                    let startX = 30, startY = 50, gapX = 15, gapY = 30;
                    for (let row = 0; row < 2; row++) {
                        for (let col = 0; col < 4; col++) {
                            drawPhoto(startX + col * (ppWidth + gapX), startY + row * (ppHeight + gapY));
                        }
                    }
                }

                // 1.0 (सर्वश्रेष्ठ गुणवत्ता) में एक्सपोर्ट
                const dataURL = canvas.toDataURL(format, 1.0);
                const link = document.createElement('a');
                link.download = `SmartPhoto_${layout}_${Date.now()}.${format.split('/')[1]}`;
                link.href = dataURL;
                link.click();

                // सफलता का संदेश
                btn.innerHTML = '✅ सफलतापूर्वक डाउनलोड हो गई';
                setTimeout(() => {
                    btn.innerHTML = 'तैयार करें और डाउनलोड करें';
                    btn.disabled = false;
                }, 3000);

            } catch (error) {
                console.error(error);
                btn.innerHTML = '❌ त्रुटि हुई';
                alert('डाउनलोड के दौरान एक तकनीकी समस्या आई।');
                btn.disabled = false;
            }
        }, 100); // 100ms की देरी ताकि लोडर स्क्रीन पर दिख सके
    });
</script>

</body>
</html>
